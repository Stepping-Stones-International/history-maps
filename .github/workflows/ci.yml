name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RAILS_ENV: test
  CI: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Show tool versions
        run: |
          ruby -v
          node -v
          npm -v
          yarn -v

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Build assets
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: app/assets/builds/**
          if-no-files-found: error

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn

      - name: Show tool versions
        run: |
          ruby -v
          node -v
          npm -v
          yarn -v

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare test database
        run: bin/rails db:prepare

      - name: Run Rails tests
        run: bin/rails test
